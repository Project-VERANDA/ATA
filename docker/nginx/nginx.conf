server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets - serve directly
    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.svg;
    }

    location = /icons.svg {
        alias /usr/share/nginx/html/icons.svg;
    }

    location /logos/ {
        alias /usr/share/nginx/html/logos/;
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - handle /app/* requests
    location /app/ {
        # First try to serve the actual file
        try_files $uri $uri/ /index.html;
        
        # For React Router, rewrite internal paths
        rewrite ^/app/(.*)$ /$1 break;
    }

    # Root location
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
