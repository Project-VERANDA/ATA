server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.svg;
    }

    location = /icons.svg {
        alias /usr/share/nginx/html/icons.svg;
    }

    location /logos/ {
        alias /usr/share/nginx/html/logos/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /app/ routes -> serve files from root directory via alias
    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Root redirects to /app/
    location = / {
        return 301 /app/;
    }

    # Catch-all
    location / {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}