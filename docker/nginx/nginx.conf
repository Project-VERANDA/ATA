server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets - serve directly
    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.svg;
    }

    location = /icons.svg {
        alias /usr/share/nginx/html/icons.svg;
    }

    location /logos/ {
        alias /usr/share/nginx/html/logos/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - handle /app/* requests
    # Vite base path is /app/, so all routes must be prefixed
    location /app/ {
        # Try to serve exact files first, fallback to index.html for SPA routes
        try_files $uri $uri/ /app/index.html;
    }

    # Root location - should return 404 since valid routes go through /app/
    location / {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}