# =============================================================================
# NGINX CONFIGURATION - Medical Data Processing (Docker)
# Simplified main config - delegates to sites-available/ for server blocks
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security Headers
    include /etc/nginx/security.headers;

    # Logging - sanitize for privacy
    log_format sanitized '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent"';

    access_log /var/log/nginx/access.log sanitized;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml;

    # Rate limiting (prevent abuse) - use consistent name with sites-available
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # =====================================================
    # CRITICAL: Include site configurations from conf.d/
    # This removes duplicate server blocks and upstream definitions
    # =====================================================
    include /etc/nginx/conf.d/*.conf;
}
