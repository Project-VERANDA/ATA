# ============================================================================
# Docker Compose for Dialogue Anonymizer
# ============================================================================

services:
  anonymizer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_WEB: ${BUILD_WEB:-true}
        DOWNLOAD_MODELS: ${DOWNLOAD_MODELS:-false}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: dialogue-anonymizer
    ports:
      - "5002:5000"
    volumes:
      # Persist models outside container
      - ./pipeline/model:/app/pipeline/model
      # Mount input/output directories
      - ./data/input:/app/data/input:ro
      - ./data/output:/app/data/output
      # Mount config
      - ./.env:/app/.env:ro
      # Mount scripts (allows updates without rebuild)
      - ./docker/scripts:/app/scripts:ro
      - ./interactive_app/app.py:/app/app.py 
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      - DOWNLOAD_MODELS=${DOWNLOAD_MODELS:-false}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-large}
      - FLASK_APP=interactive_app/app.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_URL: ${API_URL:-http://localhost:5001}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
      # Use host network for npm install to bypass Docker DNS issues
      network: host
    container_name: dialogue-anonymizer-frontend
    ports:
      - "8080:80"  # Changed to 8080 to avoid conflict with anonymizer port
    #depends_on:
    #  anonymizer:
        #condition: service_healthy
    restart: unless-stopped
    
    # DNS configuration to fix EAI_AGAIN errors
    dns:
      - 8.8.8.8
      - 1.1.1.1
    dns_opt:
      - use-ndots
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

