# ============================================================================
# Docker Compose for Dialogue Anonymizer (Complete)
# ============================================================================


services:
  anonymizer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_WEB: ${BUILD_WEB:-true}
        DOWNLOAD_MODELS: ${DOWNLOAD_MODELS:-false}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: dialogue-anonymizer
    ports:
      - "5000:5000"
    volumes:
      # Persist models outside container
      - ./pipeline/model:/app/pipeline/model
      # Mount input/output directories (adjust as needed)
      - ./data/input:/app/data/input:ro
      - ./data/output:/app/data/output
      # Mount config
      - ./.env:/app/.env:ro
      # Mount entrypoint scripts
      - ./scripts:/app/scripts:ro
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      - DOWNLOAD_MODELS=${DOWNLOAD_MODELS:-false}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-large}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: React Frontend (uncomment when needed)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_URL: http://${FRONTEND_HOST:-localhost}:5000
    container_name: dialogue-anonymizer-frontend
    ports:
      - "80:80"
    depends_on:
      anonymizer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

