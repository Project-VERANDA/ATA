version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    # CRITICAL: Use host networking to bypass Docker's broken DNS/proxy
    network_mode: "host"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=pipeline.process:app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./pipeline:/app/pipeline:ro
      - ./interactive_app:/app/interactive_app:ro
      - ./requirements-lock.txt:/app/requirements-lock.txt:ro
      - ./docker/backend/requirements.txt:/app/requirements.txt:ro
      - ./ssl_certs:/app/ssl_certs:ro
      - ./logs:/app/logs:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.25-alpine
    # Nginx also uses host network - you'll need different ports or disable nginx
    network_mode: "host"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl_certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15
    network_mode: "host"
    environment:
      POSTGRES_DB: anonymizer
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    network_mode: "host"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    network_mode: "host"
    environment:
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Djboss.socket.binding.port-offset=100"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
